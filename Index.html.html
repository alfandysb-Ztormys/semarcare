<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semar Care Health Solution </title>

    <!-- MapLibre CSS -->
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap");
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: "Plus Jakarta Sans", sans-serif; background: #f8fafc; overflow: hidden; color: #0f172a; line-height: 1.3; }
      #map { height: 100vh; }
      nav { height: 52px; background: #fff; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; padding: 0 24px; gap: 10px; position: relative; z-index: 30; }
      .nav-logo { width: 32px; height: 32px; background: #ba3333; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 22px; transform: rotate(-2deg); }
      .nav-title { font-size: 18px; font-weight: 800; }
      .nav-title span { color: #ba3333; }
      .nav-sub { font-size: 9px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1em; }
      .layout { display: flex; height: calc(100vh - 52px); }
      aside { width: 310px; background: #fff; border-right: 1px solid #f1f5f9; overflow-y: auto; padding: 20px 16px; flex-shrink: 0; z-index: 20; }
      aside::-webkit-scrollbar { width: 3px; }
      aside::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 3px; }
      .section { margin-bottom: 28px; }
      .section-title { font-size: 10px; font-weight: 900; color: #ba3333; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 10px; }
      .section-title.indigo { color: #ba3333; }
      .btn-basemap { display: block; width: 100%; text-align: left; padding: 10px 14px; border-radius: 12px; border: 2px solid #f8fafc; background: #f8fafc; color: #64748b; font-size: 11px; font-weight: 900; font-family: inherit; cursor: pointer; margin-bottom: 6px; transition: all 0.15s; }
      .btn-basemap:hover { background: #f1f5f9; }
      .card { background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 16px; padding: 14px; margin-bottom: 0; }
      .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
      .toggle-row:last-child { margin-bottom: 0; }
      .layer-label { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 900; color: #1e293b; text-transform: uppercase; }
      .dot-rs { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; }
      .dot-jalan { width: 10px; height: 2px; background: #a96f0b; border-radius: 2px; }
      .dot-admin { width: 10px; height: 10px; background: #3b82f6; border-radius: 2px; }
      .btn-toggle { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #fff; border: 1px solid #e2e8f0; color: #4f46e5; cursor: pointer; transition: background 0.15s; }
      .btn-toggle:hover { background: #f1f5f9; }
      .btn-toggle svg { width: 14px; height: 14px; }
      .form-label { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; display: block; margin-bottom: 5px; }
      .form-input { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid #e2e8f0; background: #fff; font-size: 11px; font-weight: 700; font-family: inherit; color: #1e293b; outline: none; }
      .form-input:focus { border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79,70,229,0.12); }
      .form-group { margin-bottom: 10px; }
      .btn-run { width: 100%; padding: 11px; background: #ba3333; color: #fff; border: none; border-radius: 12px; font-size: 11px; font-weight: 900; font-family: inherit; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; transition: background 0.15s; margin-top: 4px; }
      .btn-run:hover { background: #4338ca; }
      .btn-run:disabled { background: #a5b4fc; cursor: not-allowed; }
      .btn-hapus { width: 100%; padding: 8px; background: #f1f5f9; color: #64748b; border: none; border-radius: 10px; font-size: 11px; font-weight: 900; font-family: inherit; cursor: pointer; margin-top: 6px; transition: background 0.15s; }
      .btn-hapus:hover { background: #e2e8f0; }
      .buffer-info { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
      .buffer-info span { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
      .buffer-info strong { font-size: 11px; font-weight: 900; color: #ba3333; }
      .hasil-wrapper { margin-top: 10px; }
      .hasil-header { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
      .hasil-header span { color: #4f46e5; font-weight: 900; }
      #hasil { list-style: none; display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow-y: auto; }
      #hasil::-webkit-scrollbar { width: 3px; }
      #hasil::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 3px; }
      .hasil-item { padding: 8px 10px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 11px; font-weight: 700; color: #1e293b; cursor: pointer; transition: all 0.15s; }
      .hasil-item:hover { background: #eef2ff; border-color: #a5b4fc; color: #4f46e5; }
      .status-section { border-top: 1px solid #f1f5f9; padding-top: 14px; margin-top: 4px; }
      .status-item { font-size: 11px; color: #64748b; margin-bottom: 4px; }
      #map { flex: 1; }
    </style>
  </head>
  <body>

    <!-- Navbarnya -->
    <nav>
      <div class="nav-logo">S</div>
      <div>
        <div class="nav-title">Semar <span>Care</span></div>
        <div class="nav-sub">Semarang Health & Emergency Response</div>
      </div>
    </nav>

    <div class="layout">

      <!-- Sidebarnya -->
      <aside>

        <!-- Basemap Mapid -->
        <div class="section">
          <div class="section-title">1. Basemap Style</div>
          <button class="btn-basemap" onclick="updateStyleToStreet()">MAPID Street</button>
          <button class="btn-basemap" onclick="updateStyleToDark()">MAPID Dark</button>
          <button class="btn-basemap" onclick="updateStyleToSatellite()">MAPID Satellite</button>
        </div>

        <!-- Toggle Layer -->
        <div class="section">
          <div class="section-title">2. Toggle Layer</div>
          <div class="card">
            <div class="toggle-row">
              <div class="layer-label"><div class="dot-rs"></div> Rumah Sakit</div>
              <button class="btn-toggle" onclick="toggleLayerRS()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
            <div class="toggle-row">
              <div class="layer-label"><div class="dot-jalan"></div> Jalan</div>
              <button class="btn-toggle" onclick="toggleLayerJalan()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
            <div class="toggle-row">
              <div class="layer-label"><div class="dot-admin"></div> Administrasi</div>
              <button class="btn-toggle" onclick="toggleLayerAdmin()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Buffer Rumah Sakit -->
        <div class="section">
          <div class="section-title indigo">3. Buffer Rumah Sakit</div>
          <div class="card">
            <div class="form-group">
              <label class="form-label">Radius Buffer (meter)</label>
              <input type="number" id="input-buffer" class="form-input" min="100" max="5000" step="100" value="500"
                oninput="updateBuffer(parseInt(this.value))" />
            </div>
            <div class="buffer-info">
              <span>Radius aktif:</span>
              <strong id="label-buffer">500 m</strong>
            </div>
            <button class="btn-hapus" onclick="hapusBuffer()">Hapus Buffer</button>
          </div>
        </div>

        <!-- Isokron -->
        <div class="section">
          <div class="section-title indigo">4. Isochrone Tools</div>
          <div class="card">
            <div class="form-group">
              <label class="form-label">Mode Transportasi</label>
              <select id="transportasi" class="form-input">
                <option value="foot">🚶 Kaki</option>
                <option value="motorcycle">🏍 Motor</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Waktu (detik)</label>
              <input type="number" id="waktu" class="form-input" min="0" max="3600" value="300" />
            </div>
            <button id="button-run" class="btn-run">Jalankan Analisis</button>

            <div id="hasil-wrapper" style="display:none;" class="hasil-wrapper">
              <div class="hasil-header">
                Rumah Sakit dalam Jangkauan <span id="count-hasil"></span>
              </div>
              <ul id="hasil"></ul>
            </div>
          </div>
        </div>

        <!-- STATUS -->
        <div class="status-section">
          <div class="section-title">Status Data</div>
          <div class="status-item" id="status-admin">⏳ Memuat administrasi...</div>
          <div class="status-item" id="status-jalan">⏳ Memuat jalan...</div>
          <div class="status-item" id="status-rs">⏳ Memuat rumah sakit...</div>
        </div>

      </aside>

      <!-- Map -->
      <div id="map"></div>

    </div>

    <!-- ============================================================
         1. MapLibre JS
         2. Turf JS
         3. Kode peta (inline)
    ============================================================ -->
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
    

      <script src="./app.js"></script>
  </body>
</html>
